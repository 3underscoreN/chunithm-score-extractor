[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chunithm-score-extractor"
version = "0.1.0"
description = "Extract score, visible song title, and difficulty from CHUNITHM result photos"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.1,<3",
    "opencv-contrib-python==4.10.0.84",
    "Pillow>=11,<13",
]

[project.optional-dependencies]
ocr = [
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
]
ocr-gpu = [
    "paddleocr==3.7.0",
    "paddlepaddle-gpu==3.3.1",
    # The Windows wheel has CUDA requirements not present in the Linux wheel
    # metadata used by uv's cross-platform lock resolution.
    "nvidia-cuda-runtime-cu12==12.6.77; sys_platform == 'win32'",
    "nvidia-cudnn-cu12==9.5.1.17; sys_platform == 'win32'",
    "nvidia-cublas-cu12==12.6.4.1; sys_platform == 'win32'",
    "nvidia-cufft-cu12==11.3.0.4; sys_platform == 'win32'",
    "nvidia-curand-cu12==10.3.7.77; sys_platform == 'win32'",
    "nvidia-cusolver-cu12==11.7.1.2; sys_platform == 'win32'",
    "nvidia-cusparse-cu12==12.5.4.2; sys_platform == 'win32'",
]
notebook = [
    "ipykernel>=6,<8",
    "matplotlib>=3.9,<4",
    "ipywidgets>=8,<9"
]
api = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.34,<1",
]
dev = [
    "build>=1.2,<2",
    "fastapi>=0.115,<1",
    "httpx2>=2.16,<3",
    "python-multipart>=0.0.20,<1",
]

[tool.uv]
conflicts = [
    [{ extra = "ocr" }, { extra = "ocr-gpu" }],
]

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu126" }

[[tool.uv.index]]
name = "paddle-cu126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chunithm_score_extractor = ["py.typed"]
