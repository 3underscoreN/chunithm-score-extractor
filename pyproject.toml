[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chunithm-score-extractor"
version = "0.1.0"
description = "Extract score, visible song title, and difficulty from CHUNITHM result photos"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.1,<3",
    "opencv-contrib-python==4.10.0.84",
    "Pillow>=11,<13",
    "paddleocr==3.7.0",
]

[project.optional-dependencies]
cpu = [
    "onnxruntime>=1.31.1",
]
gpu = [
    "onnxruntime-gpu>=1.31.1",
]
notebook = [
    "ipykernel>=6,<8",
    "matplotlib>=3.9,<4",
    "ipywidgets>=8,<9"
]
api = [
    "fastapi>=0.160,<1",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.34,<1",
]
dev = [
    "build>=1.2,<2",
    "fastapi>=0.115,<1",
    "httpx2>=2.16,<3",
    "python-multipart>=0.0.20,<1",
]

[dependency-groups]
onnx-cpu = [
    "onnxruntime>=1.31.1",
]

[tool.uv]
default-groups = ["onnx-cpu"]
conflicts = [
    [{ group = "onnx-cpu" }, { extra = "gpu" }],
    [{ extra = "cpu" }, { extra = "gpu" }],
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chunithm_score_extractor = ["py.typed"]
